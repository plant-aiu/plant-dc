<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 식물 주치의 - 핀셋 진단</title>
  <style>
    /* 전체 배경 및 폰트 세팅 */
    body { background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .app-container { width: 100%; max-width: 400px; height: 85vh; background: #ffffff; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 24px 20px 16px; text-align: center; font-weight: 700; font-size: 17px; color: #111; border-bottom: 1px solid #f1f3f5; }
    .chat-scroll { flex: 1; overflow-y: auto; padding: 24px 20px; background: #fafafa; display: flex; flex-direction: column; gap: 24px; }
    
    /* 비주얼 핀셋 사진 카드 & 말풍선 */
    .diagnosis-card { background: #fff; border-radius: 24px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); }
    .image-wrapper { position: relative; width: 100%; border-radius: 16px; overflow: hidden; }
    .image-wrapper img { width: 100%; display: block; }
    .pin { position: absolute; top: 40%; left: 55%; font-size: 32px; animation: bounce 1.2s infinite; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    
    .ai-bubble-container { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .ai-bubble { background: #fff; padding: 18px 20px; border-radius: 4px 24px 24px 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); font-size: 15px; line-height: 1.6; color: #343a40; border-left: 4px solid #2b8a3e; }
    
    .translate-toggles { display: flex; gap: 8px; margin-left: 8px; }
    .flag-btn { background: #fff; border: 1px solid #e9ecef; border-radius: 24px; padding: 6px 12px; font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: all 0.2s ease; }
    .flag-btn.active { border-color: #2b8a3e; background: #ebfbee; }
    
    /* 하단 메시지 입력창 */
    .input-area { padding: 16px 20px; background: #fff; border-top: 1px solid #f1f3f5; display: flex; align-items: center; gap: 12px; }
    .camera-btn { background: #2b8a3e; color: white; border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(43, 138, 62, 0.3); }
    .text-input { flex: 1; background: #f1f3f5; border: none; padding: 14px 18px; border-radius: 24px; font-size: 15px; outline: none; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">🌿 다정한 식물 주치의</div>
    
    <div class="chat-scroll" id="chat-box">
      <!-- 접속하자마자 뜨는 첫인상 웰컴 메시지! -->
      <div class="ai-bubble-container" id="welcome-msg">
        <div class="ai-bubble">
          <b>안녕! 식집사님! 🌷</b><br>
          다정한 식물 주치의가 기다리고 있어요!<br>
          아래 📷 버튼을 눌러 아픈 식물 사진을 올려주세요~
        </div>
        <div class="translate-toggles">
          <button class="flag-btn active">🇰🇷</button>
          <button class="flag-btn">🇺🇸</button>
          <button class="flag-btn">🇯🇵</button>
        </div>
      </div>
    </div>
    
    <!-- 파일 첨부를 위한 숨겨진 인풋 & 텍스트 바 -->
    <div class="input-area">
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
      <button class="camera-btn" onclick="document.getElementById('file-input').click()">📷</button>
      <input type="text" class="text-input" id="chat-input" placeholder="상태를 물어보세요..." onkeypress="if(event.key === 'Enter') sendMessage()">
    </div>
  </div>

  <script>
    // 💡 깃허브 보안 경고를 피하기 위한 '반갈죽 꼼수' 세팅!
    // 아래 두 따옴표 안에 네 구글 API 키를 반씩 나눠서 넣어줘!
    const API_KEY = 'API키_앞부분' + 'API키_뒷부분'; 

    const chatBox = document.getElementById('chat-box');

    // 📷 사진이 업로드 되면 실행되는 마법!
    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) {
        // 기존 웰컴 메시지를 지우고 사진 띄우기!
        document.getElementById('welcome-msg').style.display = 'none';
        
        const reader = new FileReader();
        reader.onload = function(e) {
          const imageBase64 = e.target.result.split(',')[1];
          
          // 유저가 올린 사진과 핀(📍) 생성
          const userCard = document.createElement('div');
          userCard.className = 'diagnosis-card';
          userCard.innerHTML = `
            <div class="image-wrapper">
              <img src="${e.target.result}">
              <div class="pin">📍</div>
            </div>
          `;
          chatBox.appendChild(userCard);
          
          // AI 분석 로딩 메시지
          const loadingMsg = document.createElement('div');
          loadingMsg.className = 'ai-bubble-container';
          loadingMsg.innerHTML = `<div class="ai-bubble">음~ 사진을 자세히 보고 있어! 3초만 기다려줘~ 🌷</div>`;
          chatBox.appendChild(loadingMsg);
          chatBox.scrollTop = chatBox.scrollHeight;

          // 진짜 제미나이 API 호출 함수 (여기서 연결돼!)
          callGeminiAPI(imageBase64, loadingMsg);
        };
        reader.readAsDataURL(file);
      }
    }

    async function callGeminiAPI(imageBase64, loadingElement) {
      try {
        const promptText = "넌 다정다감한 동네 꽃집 사장님이야. 사진 속 식물의 상태를 진단하고 3줄 이내로 짧고 명확한 해결책을 한국어로 알려줘. 이모지를 꼭 써줘.";
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            contents: [{ parts: [{text: promptText}, {inlineData: { mimeType: "image/jpeg", data: imageBase64 }}] }] 
          })
        });

        const data = await response.json();
        const aiText = data.candidates[0].content.parts[0].text;
        
        // 로딩 메시지를 진짜 답변과 번역 토글로 교체!
        loadingElement.innerHTML = `
          <div class="ai-bubble">${aiText.replace(/\n/g, '<br>')}</div>
          <div class="translate-toggles">
            <button class="flag-btn active">🇰🇷</button>
            <button class="flag-btn">🇺🇸</button>
            <button class="flag-btn">🇯🇵</button>
          </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        loadingElement.innerHTML = `<div class="ai-bubble">앗, 지금 손님이 많아서 분석이 좀 늦어지네 😭 다시 시도해 줄래?</div>`;
      }
    }
  </script>
</body>
</html>
