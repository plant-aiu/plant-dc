<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 식물 주치의 - 대시보드</title>
  <style>
    /* 전체 배경 및 폰트 세팅 */
    body { background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .app-container { width: 100%; max-width: 400px; height: 85vh; background: #ffffff; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; position: relative; }
    
    /* 상단 환영 메시지 */
    .header { padding: 32px 24px 16px; background: linear-gradient(180deg, #ffffff 0%, #fcfdfd 100%); z-index: 10; }
    .header h1 { margin: 0; font-size: 24px; font-weight: 800; color: #111; }
    .header p { margin: 6px 0 0; font-size: 14px; color: #868e96; }

    /* 대시보드 스크롤 영역 */
    .dashboard-scroll { flex: 1; overflow-y: auto; padding: 16px 24px 100px; background: #f8f9fa; display: flex; flex-direction: column; gap: 16px; }
    
    /* 메인 카드 디자인 (화이트 & 소프트 섀도우) */
    .card { background: #fff; border-radius: 24px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s ease; cursor: pointer; }
    .card:hover { transform: translateY(-2px); }
    .card-title { font-size: 18px; font-weight: 700; color: #343a40; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 14px; color: #868e96; line-height: 1.5; margin: 0; }
    
    /* 카드 내 버튼 및 태그 */
    .tag-group { display: flex; gap: 8px; }
    .tag { background: #f1f3f5; color: #495057; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; }
    .action-btn { background: #ebfbee; color: #2b8a3e; border: none; padding: 12px; border-radius: 16px; font-weight: 700; font-size: 15px; margin-top: 8px; display: flex; justify-content: center; align-items: center; gap: 6px; }
    
    /* 하단 네비게이션 바 (가운데 둥근 카메라 버튼 포함) */
    .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 80px; background: #fff; border-top: 1px solid #f1f3f5; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); border-radius: 0 0 32px 32px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #adb5bd; font-size: 11px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: #2b8a3e; }
    
    /* 중앙 플로팅 카메라 버튼 */
    .center-cam-wrapper { position: relative; top: -20px; }
    .center-cam { background: #2b8a3e; width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; color: white; box-shadow: 0 8px 24px rgba(43, 138, 62, 0.4); border: 4px solid #fff; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>안녕하세요, 식집사님! 👋</h1>
      <p>오늘도 초록초록한 하루 보내세요</p>
    </div>
    
    <div class="dashboard-scroll">
      <!-- 1. 빠른 식물 진단 카드 -->
      <div class="card">
        <div class="card-title">🔍 빠른 식물 진단</div>
        <p class="card-desc">사진을 찍고 몇 초 만에 AI의 정확한 처방전을 받아보세요.</p>
        <div class="tag-group">
          <span class="tag">⚡ 즉시 결과</span>
          <span class="tag">✨ AI 지원</span>
        </div>
        <button class="action-btn">📷 진단 시작하기 →</button>
      </div>

      <!-- 2. 식물 매치 (플랜테리어) 카드 -->
      <div class="card">
        <div class="card-title">🪴 공간 맞춤 식물 매치</div>
        <p class="card-desc">내 방 사진을 분석하여 가장 잘 어울리는 식물을 추천해 드려요.</p>
        <button class="action-btn" style="background: #f3f0ff; color: #6741d9;">🪄 내 식물 찾아보기 →</button>
      </div>

      <!-- 3. AI 채팅 카드 -->
      <div class="card">
        <div class="card-title">💬 다정한 사장님과 채팅</div>
        <p class="card-desc">식물 관리에 대한 모든 것, 무엇이든 편하게 물어보세요!</p>
      </div>

      <!-- 4. 내 정원 카드 -->
      <div class="card">
        <div class="card-title">🏡 내 정원</div>
        <p class="card-desc">AI 진단과 관리 팁을 받으려면 첫 번째 반려 식물을 추가해 보세요.</p>
        <button class="action-btn" style="background: #f8f9fa; color: #495057;">+ 첫 번째 식물 추가</button>
      </div>
    </div>
    
    <!-- 하단 네비게이션 바 -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <span style="font-size: 20px;">📊</span>
        <span>대시보드</span>
      </div>
      <div class="nav-item">
        <span style="font-size: 20px;">🌿</span>
        <span>내 식물</span>
      </div>
      <div class="center-cam-wrapper">
        <div class="center-cam">📷</div>
      </div>
      <div class="nav-item">
        <span style="font-size: 20px;">🔔</span>
        <span>알림</span>
      </div>
      <div class="nav-item">
        <span style="font-size: 20px;">⚙️</span>
        <span>설정</span>
      </div>
    </div>
  </div>
</body>
</html>
